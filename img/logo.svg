<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <!-- Hexagon node icon -->
  <polygon points="18,4 30,4 36,15 30,26 18,26 12,15" fill="none" stroke="#ff6b00" stroke-width="1.8"/>
  <!-- inner nodes -->
  <circle cx="18" cy="4" r="2.2" fill="#ff6b00"/>
  <circle cx="30" cy="4" r="2.2" fill="#ff6b00"/>
  <circle cx="36" cy="15" r="2.2" fill="#ff6b00"/>
  <circle cx="30" cy="26" r="2.2" fill="#ff6b00"/>
  <circle cx="18" cy="26" r="2.2" fill="#ff6b00"/>
  <circle cx="12" cy="15" r="2.2" fill="#ff6b00"/>
  <!-- center -->
  <circle cx="24" cy="15" r="3" fill="#ff6b00" opacity="0.9"/>
  <!-- lines center to nodes -->
  <line x1="24" y1="15" x2="18" y2="4" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <line x1="24" y1="15" x2="30" y2="4" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <line x1="24" y1="15" x2="36" y2="15" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <line x1="24" y1="15" x2="30" y2="26" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <line x1="24" y1="15" x2="18" y2="26" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <line x1="24" y1="15" x2="12" y2="15" stroke="#ff6b00" stroke-width="0.9" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="46" y="22" font-family="'Orbitron', 'Courier New', monospace" font-size="19" font-weight="700" fill="#ff6b00" letter-spacing="1">FYNEXT</text>
</svg>
